- name: Install
  hosts: all
  vars_files:
    - ./variables.yml
  vars_prompt:
    - name: admin_pass
      prompt: Provide a password for the eXist-db admin user
      default: ""
    - name: tei_pass
      prompt: Provide a password for the tei user
      default: ""
  tasks:
    - name: Check for existing installation
      ansible.builtin.stat:
        path: "{{dest}}"
      register: avail
    - name: Stop docker
      ansible.builtin.shell:
        cmd: docker compose down
        chdir: "{{dest}}"
      when: avail.stat.isdir is defined and avail.stat.isdir
      ignore_errors: true
    - name: Prune volumes
      ansible.builtin.shell:
        cmd: docker volume prune -f
        chdir: "{{dest}}"
      when: avail.stat.isdir is defined and avail.stat.isdir
      ignore_errors: true
    - name: Remove existing directory
      when: avail.stat.isdir is defined and avail.stat.isdir
      ansible.builtin.file:
        path: "{{dest}}"
        state: absent
      tags:
        - clean
    - name: Check admin password
      ansible.builtin.assert:
        that:
          - "\"'\" not in admin_pass"
          - "\"'\" not in (publisher.tei_pass | default(''))"
        fail_msg: "Passwords must not contain a single quote (')"
        quiet: true
    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{dest}}/nginx/conf"
        - "{{dest}}/exist-init"
    - name: Copy files
      ansible.builtin.copy:
        src: '{{ item.src }}'
        dest: '{{ item.dest }}'
        mode: '{{ item.mode | default(omit) }}'
      loop:
        - { src: ../nginx/conf/00-cache.conf, dest: "{{dest}}/nginx/conf/" }
        - { src: ../nginx/conf/00-limits.conf, dest: "{{dest}}/nginx/conf/" }
        - { src: ../nginx/conf/block-probes.inc, dest: "{{dest}}/nginx/conf/" }
        - { src: ../nginx/conf/document-block-bots.inc, dest: "{{dest}}/nginx/conf/" }
        - { src: ../nginx/conf/document-cache-params.inc, dest: "{{dest}}/nginx/conf/" }
        - { src: ../exist-init/entrypoint.sh, dest: "{{dest}}/exist-init/" }
        - { src: ../exist-init/set-passwords.sh, dest: "{{dest}}/exist-init/" }
        - { src: ../certbot-renew.sh, dest: "{{dest}}", mode: '0755' }
        - { src: ../iiif, dest: "{{dest}}" }
      tags:
        - copy
    - name: Copy site-specific nginx files
      ansible.builtin.copy:
        src: "../nginx/site/{{ item }}"
        dest: "{{dest}}/nginx/conf/"
      loop: "{{ nginx_site_files | default([]) }}"
      tags:
        - copy
        - frontend
    - name: Write .env
      ansible.builtin.template:
        src: env.njk
        dest: "{{dest}}/.env"
        mode: '0600'
      tags:
        - copy
    - name: Generate Dockerfile and docker-compose.yml
      block:
        - name: Generate docker-compose.yml from template
          connection: local
          ansible.builtin.template:
            src: docker-compose.yml.njk
            dest: "{{playbook_dir}}/docker-compose.yml.generated"
        - name: Generate Dockerfile from template
          connection: local
          ansible.builtin.template:
            src: Dockerfile.njk
            dest: "{{playbook_dir}}/Dockerfile.generated"
          when: publisher.apps | default([]) | length > 0
        - name: Copy docker-compose.yml to server
          ansible.builtin.copy:
            src: "{{playbook_dir}}/docker-compose.yml.generated"
            dest: "{{dest}}/docker-compose.yml"
        - name: Copy Dockerfile to server
          ansible.builtin.copy:
            src: "{{playbook_dir}}/Dockerfile.generated"
            dest: "{{dest}}/Dockerfile"
          when: publisher.apps | default([]) | length > 0
      tags:
        - dockerfile
    - name: Create nginx configs
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - { src: upstream.conf.njk, dest: "{{dest}}/nginx/conf/upstream.conf" }
        - { src: default.conf.njk, dest: "{{dest}}/nginx/conf/default.conf" }
        - { src: default.ssl.conf.njk, dest: "{{dest}}/nginx/conf/default.ssl.conf.off" }
      tags:
        - frontend
    - name: Build docker images
      ansible.builtin.shell:
        cmd: docker compose build --no-cache --pull
        chdir: "{{dest}}"
      when: publisher.apps | default([]) | length > 0
    - name: Pull docker images
      ansible.builtin.shell:
        cmd: docker compose pull --ignore-buildable
        chdir: "{{dest}}"
    # The admin password from the prompt is set by the publisher entrypoint
    # (exist-init) on first start, while the database still has an empty password.
    - name: Launch HTTP
      ansible.builtin.shell:
        cmd: docker compose up -d --force-recreate
        chdir: "{{dest}}"
      tags:
        - launch
    - name: Acquire certificates
      ansible.builtin.shell:
        cmd: docker compose run --rm  certbot certonly {{"--test-cert" if cert.use_staging}} --webroot --webroot-path /var/www/certbot/ -n --agree-tos -m {{cert.email}} -d {{item}}
        chdir: "{{dest}}"
      loop: "{{ domains | map(attribute='hostname') | list + (domains | map(attribute='aliases', default=[]) | flatten) }}"
      tags:
        - cert
    - name: Enable HTTPS
      ansible.builtin.copy:
        src: "{{dest}}/nginx/conf/default.ssl.conf.off"
        dest: "{{dest}}/nginx/conf/default.ssl.conf"
        remote_src: true
    - name: Restart frontend
      ansible.builtin.shell:
        cmd: docker compose restart frontend
        chdir: "{{dest}}"
    - name: Add cronjob for certificate renewal
      ansible.builtin.cron:
        name: "Renew certificate"
        hour: "3"
        minute: "0"
        weekday: "1"
        job: "{{dest}}/certbot-renew.sh"
    - import_tasks: check.yml