# path to directory in which the docker compose configuration will be installed
dest: /root/docker
# which optional services should be started?
services:
  # IIIF image service
  iiif: true
  # Named entity recognition
  ner: true
# site-specific nginx files from nginx/site/ copied to the server. *.conf files
# are loaded at http level, other files are used via `includes` below.
nginx_site_files:
  - 10-chronicle.conf
  - site-teipublisher.inc
  - robots-chronicle.txt
# the domains to be served by the proxy. Each domain may map to a different app and root path
# within the same eXist-db instance
domains:
  - name: tei-publisher
    # eXist-db path the root of the server will be mapped to. Specifying a path here
    # will map the root to one single app. Change to empty string ("") if you want to expose the
    # entire database and also set `context_path: auto` below.
    root: /exist/apps/tei-publisher
    # if root is mapped to a single app, should requests to /exist/apps/ still be allowed?
    allow_apps: true
    # the name the server should listen to
    hostname: tei-publisher.org
    # apps below /exist/apps/ which should not be reachable through the proxy.
    # Recommended for production: eXide, jinks and the eXist admin tools.
    # Left open on tei-publisher.org.
    # They stay reachable on port 8080 of the server itself (e.g. via ssh tunnel).
    # Do not block the app `root` points to.
    # block_apps: [eXide, jinks, dashboard, monex, packageservice, doc, fundocs]
    # block eXist-db's REST, RESTXQ, XML-RPC and WebDAV interfaces in the proxy. They are
    # only exposed if root is "". Apps calling /exist/rest from the browser will break.
    block_services: true
    # other host names which permanently redirect to `hostname`. A certificate is
    # requested for each of them.
    aliases:
      - www.tei-publisher.org
      - teipublisher.org
      - www.teipublisher.org
      - tei-publisher.com
      - www.tei-publisher.com
      - teipublisher.com
      - www.teipublisher.com
    # extra nginx files (from nginx_site_files) included in the server block
    includes:
      - site-teipublisher.inc
    # cookie path for apps below /exist/apps/ (default: /exist)
    apps_cookie_path: /
    # settings for the proxy cache. If enabled, requests to content in reading view will be cached
    # unless they have been changed. To detect changes, you must set `caching_support: true` in the
    # publisher section below.
    #
    # In addition, generated documents matching one of the patterns in `urls` are cached
    # for 7 days, rate limited and blocked for AI crawlers (see nginx/conf/document-*.inc).
    # Markdown exports are cached too, but not blocked.
    cache:
      # enable caching
      enable: true
      # how long cached /api/parts/ responses are kept (they are revalidated with eXist-db)
      parts_expires: 7d
      urls:
        # cache pdf, epub, print, tex and docx output
        - /api/document/.+/(pdf|epub|print|tex|docx)$
publisher:
  # Image to run. Defaults to the latest jinks release without additional apps.
  # If `apps` below is not empty, the apps are built on top of `base_image` instead
  # and this setting is ignored.
  image: wolfgangmm/tei-publisher-home:latest
  # memory limit for the publisher container; the Java heap is set to 65% of it
  memory: 4g
  build:
    # directory or repository URL containing the Dockerfile to build publisher from
    context: .
    # use one of the below instead if you want to build from an external git repository (needs a Dockerfile):
    # context: https://github.com/eeditiones/tei-publisher-app.git#master
    # if the repo is not public, you may need to provide an ACCESS_TOKEN (specify in .env)
    # context: https://${ACCESS_TOKEN_NAME}:${ACCESS_TOKEN_VALUE}@gitlab.com/xxx/xxx.git
  # image the apps below are added to
  base_image: ghcr.io/eeditiones/jinks:latest
  # list of additional apps to build and install. Empty: run `image` as is.
  apps: []
    # - name: "tei-publisher-app"
    #   # Tag or branch to build
    #   tag_or_branch: "master"
    #   # GIT repository to clone the app from
    #   repo: "https://github.com/eeditiones/tei-publisher-app.git"
    #   # enable to embed webcomponents in the app instead of using external CDN
    #   local_webcomponents: false
    #   # optional command to run before ant
    #   # prebuild: "npm install"
  # App context path: set to 'auto' if apps should be exposed under their full path
  # (e.g. /exist/apps/tei-publisher)
  context_path: "auto"
  # support cache revalidation: if set, TEI Publisher will respond to the If-Modified-Since header.
  # needed if you enable caching in the proxy section above.
  # false matches the image default the live server runs with
  caching_support: false
  # Who may run XQuery sent to eXist's REST interface (?_query=, ?_xpath=, POSTed
  # queries): disabled (default), authenticated or enabled. Never use enabled on a
  # public server: any visitor could run queries as guest. authenticated admits
  # anyone with valid credentials, including the guest account.
  rest_submission: disabled
  # Optional password for the tei user, set together with the admin password on the
  # first start. Leave empty if no app creates a tei user.
  tei_pass: "{{ tei_pass | default('') }}"
cert:
  # should real SSL certificates be requested? set to true during testing to not hit limits
  use_staging: false
  # email address for notifications concerning SSL certificates
  email: admin@jinntec.de
iiif:
  images: ./iiif
