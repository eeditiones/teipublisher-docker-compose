- hosts: all
  # Pulls (or rebuilds) the publisher image and restarts everything using the
  # existing configuration on the host.
  # Note: pruning volumes deletes the database. The admin password from .env is
  # applied again by the publisher entrypoint on the fresh database.
  vars_files:
    - ./variables.yml
  tasks:
    - name: Stop docker
      ansible.builtin.shell:
        cmd: docker compose down
        chdir: "{{dest}}"
    - name: Prune volumes
      ansible.builtin.shell:
        cmd: docker volume prune -a -f
        chdir: "{{dest}}"
    - name: Rebuild images
      ansible.builtin.shell:
        cmd: docker compose build --no-cache --pull
        chdir: "{{dest}}"
      when: publisher.apps | default([]) | length > 0
    - name: Pull images
      ansible.builtin.shell:
        cmd: docker compose pull --ignore-buildable
        chdir: "{{dest}}"
    - name: Start docker
      ansible.builtin.shell:
        cmd: docker compose up -d --force-recreate
        chdir: "{{dest}}"
    - import_tasks: check.yml
