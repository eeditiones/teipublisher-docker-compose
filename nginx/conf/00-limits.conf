# HTTP-level maps and zones for document-export protection.
# Named 00-*.conf so this file is loaded before the server configs.

# Default UA of Node's `got` client, plus common AI/training fetchers.
# Applied only to PDF/EPUB/DOCX/print/tex, not markdown.
map $http_user_agent $is_llm_ua {
    default 0;
    # Quoted so nginx does not eat backslashes. Default UA of Node `got`.
    "~*sindresorhus/got" 1;
    ~*mistralai-api 1;
    ~*msh-pdfmin 1;
    ~*GPTBot 1;
    ~*ChatGPT-User 1;
    ~*OAI-SearchBot 1;
    ~*CCBot 1;
    ~*ClaudeBot 1;
    ~*anthropic-ai 1;
    ~*Google-Extended 1;
    ~*Google-CloudVertexBot 1;
    ~*Bytespider 1;
    ~*Amazonbot 1;
    ~*Perplexity 1;
    ~*YouBot 1;
    ~*cohere-ai 1;
    ~*meta-externalagent 1;
    ~*FacebookBot 1;
    ~*Applebot-Extended 1;
    ~*Diffbot 1;
    ~*SSI-Nutch 1;
}

limit_req_zone $binary_remote_addr zone=doc_export_ip:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=doc_export_conn:10m;

# All other traffic. eXist has 20 database connections (pool.max=20).
# One browser opens about 6. Eight per address lets that browser through
# and stops one crawler address from taking the whole pool. The shared
# zone caps every address on a vhost together, so several crawler
# addresses cannot multiply past the pool. Keyed by $server_name so
# redirect-only vhosts do not share the app server's budget.
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
limit_conn_zone $server_name zone=exist_conn:1m;

# Vulnerability-scan paths. $uri has no query string. These hosts do not
# serve PHP, env files, or WordPress, so the requests never reach eXist.
map $uri $is_probe_uri {
    default 0;
    "~*(^|/)\.env($|\.)" 1;
    "~*(^|/)sendgrid\.env$" 1;
    "~*(^|/)env$" 1;
    "~*(^|/)env\.txt$" 1;
    "~*(^|/)env-config\.js$" 1;
    "~*(^|/)runtime-config\.js$" 1;
    "~*(^|/)aws-exports\.js$" 1;
    "~*(^|/)docker-compose\.ya?ml$" 1;
    "~*(^|/)\.git(/|$)" 1;
    "~*(^|/)wp-config" 1;
    "~*(^|/)wp-content/" 1;
    "~*(^|/)wp-includes/" 1;
    "~*wlwmanifest\.xml$" 1;
    "~*vendor/composer/" 1;
    "~*(^|/)phpinfo(\.php)?$" 1;
    "~*\.php($|\.)" 1;
}

limit_req_status 429;
limit_conn_status 429;
