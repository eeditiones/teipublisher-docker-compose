# Shared proxy cache used by all server blocks. Named 00-*.conf so it is
# loaded before the server configs.
# page_cache should be large enough to accomodate all keys and should correlate with max_size
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=page_cache:512m max_size=1g use_temp_path=off inactive=7d;
