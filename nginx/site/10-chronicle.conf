# teipublisher.org only: crawler rules for the wall-came-down chronicle.
# Loaded at http level (conf.d/*.conf); used by site-teipublisher.inc.

# $is_args is "?" when a query string is present. Filtered chronicle views
# stay usable in a browser, but are not a page crawlers should index.
map $is_args $chronicle_robots {
    default "index, follow";
    "?"     "noindex, nofollow";
}

# Search and training crawlers. "bot/" covers Googlebot, MJ12bot, bingbot, and the rest.
# GoogleOther has no "bot" token. Browsers do not match.
map $http_user_agent $chronicle_crawler {
    default 0;
    "~*(?:bot|spider|crawler|slurp)(?:/|[[:space:];])" 1;
    ~*GoogleOther 1;
    ~*Google-InspectionTool 1;
    ~*Google-Extended 1;
    ~*Bytespider 1;
    ~*PetalBot 1;
    ~*Ahrefs 1;
    ~*Semrush 1;
    ~*DuckDuck 1;
    ~*Yandex 1;
    ~*facebookexternalhit 1;
    ~*meta-externalagent 1;
    ~*ChatGPT 1;
    ~*anthropic-ai 1;
    ~*Perplexity 1;
    ~*Diffbot 1;
    ~*cohere-ai 1;
}

# "1?" is a crawler plus a query string. That request is refused in nginx.
map "$chronicle_crawler$is_args" $block_chronicle_query {
    default 0;
    "1?"    1;
}
